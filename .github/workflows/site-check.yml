name: Website smoke tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: npm install --ignore-scripts
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Test site interactions
        run: node tests/site-smoke.mjs
      - name: Check published GitHub Pages URL (informational)
        if: always()
        run: |
          STATUS=$(curl -L -s -o /dev/null -w "%{http_code}" --max-time 15 "https://erikw1024.github.io/github.io-crows-nest-activities-/")
          echo "Public Pages HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::GitHub Pages is not yet returning HTTP 200. Check Settings > Pages."
          fi
